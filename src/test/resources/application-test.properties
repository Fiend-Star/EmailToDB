spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=test
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
logging.level.org.springframework.web=DEBUG
logging.level.com.emailtodb=DEBUG
logging.level.com.microsoft.graph=INFO
spring.main.allow-circular-references=false

# Gmail settings
gmail.user.email=${emailUser:test@example.com}
gmail.sender.emailFilter=${emailFilter:test@example.com}

# Outlook settings for tests
outlook.client.id=${outlookClientId:test-client-id}
outlook.client.secret=${outlookClientSecret:test-client-secret}
outlook.tenant.id=${outlookTenantId:test-tenant-id}
outlook.user.email=${outlookUserEmail:test@example.com}

# Connection timeout settings
outlook.connection.timeout=10
outlook.read.timeout=20
outlook.max.idle.connections=5
outlook.keepalive.duration=60

# Actuator settings
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

