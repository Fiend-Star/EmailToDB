# DB Configuration
#spring.datasource.url=jdbc:${dbType}://${dbHost}:${dbPort};${dbName}
#spring.datasource.username=${dbUser}
#spring.datasource.password=${dbPassword}

spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.jdbc.core=DEBUG

# Spring Boot and Actuator Configuration
server.port=9091
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.endpoint.prometheus.enabled=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.emailtodb=DEBUG
logging.level.com.microsoft.graph=INFO
spring.main.allow-circular-references=false

# Azure Storage
azure.storage.account-name=${azure.storage.account-name}
azure.storage.container-name=${azure-storage-container-name}

# Gmail Configuration
gmail.user.email=${emailUser}
gmail.sender.emailFilter=${emailFilter}
gmail.user.email.summary.to=${emailSummaryTo}
gmail.user.email.summary.cc=${emailSummaryCC}
email.body.regex.filter=${emailBodyRegexFilter}
email.body.eliminator.strings=${emailBodyEliminatorStringsSet}

service-secret-json=${service-secrets}

# Outlook Configuration
outlook.client.id=${outlookClientId:}
outlook.client.secret=${outlookClientSecret:}
outlook.tenant.id=${outlookTenantId:}
outlook.user.email=${outlookUserEmail:}

# Outlook Connection Settings
outlook.connection.timeout=${outlookConnectionTimeout:30}
outlook.read.timeout=${outlookReadTimeout:60}
outlook.max.idle.connections=${outlookMaxIdleConnections:10}
outlook.keepalive.duration=${outlookKeepAliveDuration:300}

# Outlook Retry Settings
outlook.retry.maxAttempts=${outlookRetryMaxAttempts:3}
outlook.retry.initialBackoffMs=${outlookRetryInitialBackoffMs:1000}
outlook.retry.maxBackoffMs=${outlookRetryMaxBackoffMs:60000}
outlook.retry.multiplier=${outlookRetryMultiplier:2.0}

# Email Provider Configuration
email.providers.enabled=${emailProvidersEnabled:gmail}
email.multi.provider.enabled=${multiProviderEnabled:false}
email.fetch.cron=${emailFetchCron:0 */15 * * * *}

# HikariCP settings
spring.datasource.hikari.idle-timeout=1800000
spring.datasource.hikari.max-lifetime=3600000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=${dbMaximumPoolSize:10}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
